<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kartik Gupta — IIT Delhi · Co-Founder, Gatician</title>
    <meta name="description" content="Kartik Gupta's interactive 3D portfolio — IIT Delhi, co-founder of Gatician. Drive around the island to explore." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kartikgupta-portfolio.vercel.app/" />
    <meta property="og:title" content="Kartik Gupta — IIT Delhi · Co-Founder, Gatician" />
    <meta property="og:description" content="An interactive 3D portfolio — drive around the island to explore my work, ventures and achievements." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Pick the theme before anything paints: the visitor's saved choice, else Sunset (neon) for everyone
      try {
        var saved = localStorage.getItem('theme-v2')
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' || saved === 'neon' ? saved : 'neon'
      } catch (e) {
        document.documentElement.dataset.theme = 'neon'
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="sunset-haze" aria-hidden="true"></div>

    <!-- Intro / loading -->
    <div id="intro" class="overlay">
      <div class="intro-card">
        <button class="btn icon theme-toggle" data-theme-toggle title="Switch light / dark" aria-label="Switch light or dark theme"></button>
        <h1 id="intro-name"></h1>
        <p id="intro-title" class="muted"></p>
        <p id="intro-status">Loading…</p>
        <button id="start-btn" class="btn primary" disabled>Start driving</button>
        <div class="keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows drive</span>
          <span><kbd>Shift</kbd> boost</span>
          <span><kbd>Space</kbd> brake</span>
          <span><kbd>R</kbd> reset car</span>
          <span><kbd>M</kbd> music</span>
        </div>
        <p class="touch-hint">🕹️ Drag the joystick to drive — the car goes where you point</p>
        <button id="intro-resume" class="link-btn">Prefer a classic résumé? View it here</button>
      </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-name"><strong id="hud-name"></strong><span id="hud-title"></span></div>
      <button id="menu-btn" class="btn small icon" aria-label="Open menu" aria-expanded="false">⋯</button>
      <div class="hud-actions" id="hud-actions">
        <button id="music-btn" class="btn small icon" title="Music on / off (M)" aria-label="Turn music on or off"><span class="i">🎵</span><span class="lbl">Music</span></button>
        <button class="btn small icon" data-theme-toggle title="Switch theme" aria-label="Switch theme"><span class="i"></span><span class="lbl">Theme</span></button>
        <button id="resume-btn" class="btn small"><span class="i only-menu">📄</span><span>Résumé</span></button>
        <button id="reset-btn" class="btn small icon" title="Reset car (R)"><span class="i">↺</span><span class="lbl">Reset car</span></button>
      </div>
      <div id="zone-hint" class="zone-hint"></div>
    </div>

    <!-- Zone panel -->
    <aside id="panel" class="panel" aria-live="polite">
      <div class="sheet-handle" aria-hidden="true"><span></span></div>
      <button class="panel-close" aria-label="Close">×</button>
      <div class="panel-body"></div>
    </aside>

    <!-- Full résumé view -->
    <div id="resume" class="overlay hidden">
      <div class="resume-card">
        <button class="panel-close" aria-label="Close">×</button>
        <div class="resume-body"></div>
      </div>
    </div>

    <!-- Touch controls -->
    <div id="touch" class="hidden">
      <div id="joystick" aria-label="Drag to drive">
        <div class="joy-ring"></div>
        <div class="joy-knob"></div>
      </div>
      <button id="boost-btn" aria-label="Boost">⚡<span>Boost</span></button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
